<path class="traceB" d="M200 675 C220 662 240 662 260 675 S300 688 320 675 S360 662 380 675 S420 688 440 675 S480 662 500 675 S540 688 560 675 S600 662 620 675 S660 688 680 675 S720 662 740 675 S780 688 800 675 S840 662 860 675 S900 688 920 675 S960 662 980 675 S1020 688 1040 675 S1080 662 1100 675 S1120 684 1120 675"/>

<text x="55" y="737" class="label green">Abdomen</text><text x="55" y="761" class="tiny muted">reduced excursion</text>
<path class="traceG" d="M200 750 C220 739 240 739 260 750 S300 761 320 750 S360 739 380 750 S420 761 440 750 S480 739 500 750 S540 761 560 750 S600 739 620 750 S660 761 680 750 S720 739 740 750 S780 761 800 750 S840 739 860 750 S900 761 920 750 S960 739 980 750 S1020 761 1040 750 S1080 739 1100 750 S1120 758 1120 750"/>

<text x="55" y="812" class="label blue">SpO₂</text><text x="55" y="836" class="tiny muted">oxygenation trend</text>
<polyline class="traceB" points="200,806 315,812 430,820 545,829 660,839 775,850 890,861 1005,872 1120,884"/>
<text x="205" y="790" class="value blue">95%</text><text x="420" y="806" class="value blue">93%</text><text x="650" y="825" class="value blue">90%</text><text x="880" y="848" class="value blue">87%</text><text x="1080" y="872" class="value blue">84%</text>

<text x="55" y="882" class="label green">tcCO₂</text><text x="55" y="906" class="tiny muted">ventilation trend</text>
<polyline class="traceG" points="200,895 315,889 430,882 545,873 660,863 775,852 890,841 1005,830 1120,818"/>
<text x="205" y="920" class="value green">46</text><text x="420" y="910" class="value green">48</text><text x="650" y="896" class="value green">51</text><text x="880" y="878" class="value green">54</text><text x="1080" y="850" class="value green">58 mm Hg</text>

<rect x="35" y="960" width="545" height="465" rx="20" class="paper"/><rect x="35" y="960" width="545" height="58" rx="18" class="navy"/><text x="62" y="999" fill="#fff" class="h2">2) PATTERN RECOGNITION</text>
<g class="small"><text x="65" y="1065" class="label navy">Breathing continues but is too shallow</text><text x="65" y="1095" class="muted">Airflow is present; amplitude and belt excursion are reduced.</text><line x1="65" y1="1120" x2="550" y2="1120" class="grid"/><text x="65" y="1160" class="label navy">Oxygen drifts downward</text><text x="65" y="1190" class="muted">SpO₂ shows a gradual, sustained decline during REM.</text><line x1="65" y1="1215" x2="550" y2="1215" class="grid"/><text x="65" y="1255" class="label navy">CO₂ drifts upward</text><text x="65" y="1285" class="muted">tcCO₂ rises progressively, supporting hypoventilation.</text><line x1="65" y1="1310" x2="550" y2="1310" class="grid"/><text x="65" y="1350" class="label navy">Do not let the AHI hide the pattern</text><text x="65" y="1380" class="muted">Obstructive events can coexist but may not explain sustained gas-exchange changes.</text></g>

<rect x="610" y="960" width="555" height="465" rx="20" class="paper"/><rect x="610" y="960" width="555" height="58" rx="18" class="green"/><text x="638" y="999" fill="#fff" class="h2">3) FICTIONAL CHART CLUES</text>
<g class="small"><text x="640" y="1060" class="label navy">BMI</text><text x="1125" y="1060" text-anchor="end" class="value">46 kg/m²</text><line x1="640" y1="1080" x2="1135" y2="1080" class="grid"/><text x="640" y="1120" class="label navy">Serum bicarbonate</text><text x="1125" y="1120" text-anchor="end" class="value">31 mEq/L</text><line x1="640" y1="1140" x2="1135" y2="1140" class="grid"/><text x="640" y="1180" class="label navy">Awake ABG pH</text><text x="1125" y="1180" text-anchor="end" class="value">7.37</text><text x="640" y="1220" class="label navy">PaCO₂</text><text x="1125" y="1220" text-anchor="end" class="value">49 mm Hg</text><text x="640" y="1260" class="label navy">PaO₂</text><text x="1125" y="1260" text-anchor="end" class="value">63 mm Hg</text><text x="640" y="1300" class="label navy">HCO₃⁻</text><text x="1125" y="1300" text-anchor="end" class="value">28 mEq/L</text><line x1="640" y1="1320" x2="1135" y2="1320" class="grid"/><text x="640" y="1360" class="label navy">Symptoms</text><text x="640" y="1390" class="muted">Morning headaches · hypersomnolence · loud snoring</text></g>

<rect x="35" y="1450" width="1130" height="105" rx="18" fill="#fff7df" stroke="#d8b75e" stroke-width="2"/>
<text x="600" y="1490" text-anchor="middle" class="label gold">AI-RENDERED EDUCATIONAL SIMULATION (IMITATION)</text>
<text x="600" y="1522" text-anchor="middle" class="small navy">Not an actual patient recording, diagnostic report, or AASM Scoring Manual image.</text>
<text x="600" y="1548" text-anchor="middle" class="tiny muted">Waveforms, trends, laboratory values, and patient details are fictional. Use the current AASM manual and local policy.</text>
