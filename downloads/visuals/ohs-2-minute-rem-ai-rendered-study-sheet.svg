<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Obesity hypoventilation on polysomnography: two-minute REM study sheet</title>
<desc id="desc">AI-rendered educational simulation with four 30-second REM epochs, two EOG channels, shallow breathing, reduced thoracoabdominal excursion, falling oxygen saturation, rising transcutaneous carbon dioxide, and fictional blood-gas clues.</desc>
<defs>
  <style>
    .bg{fill:#f7fbff}.paper{fill:#fff;stroke:#b8cbe2;stroke-width:2}.navy{fill:#12325f}.blue{fill:#1f5fbf}.green{fill:#1f7a4f}.purple{fill:#6941a5}.gold{fill:#b8872f}.muted{fill:#526173}.grid{stroke:#d5e0ed;stroke-width:1}.epoch{stroke:#9fb4cb;stroke-width:2;stroke-dasharray:8 7}.traceB{fill:none;stroke:#1f5fbf;stroke-width:2.2}.traceK{fill:none;stroke:#1e2936;stroke-width:2.4}.traceG{fill:none;stroke:#1f7a4f;stroke-width:3}.traceP{fill:none;stroke:#6941a5;stroke-width:2}.head{font:700 52px Arial,sans-serif}.sub{font:italic 28px Arial,sans-serif}.h2{font:700 29px Arial,sans-serif}.label{font:700 20px Arial,sans-serif}.small{font:18px Arial,sans-serif}.tiny{font:15px Arial,sans-serif}.value{font:700 21px Arial,sans-serif}
  </style>
</defs>
<rect class="bg" width="1200" height="1600"/>
<text x="600" y="70" text-anchor="middle" class="head navy">Obesity Hypoventilation on Polysomnography</text>
<text x="600" y="112" text-anchor="middle" class="sub blue">Practical Notes for the Polysomnographic Technician / Sleep Technician</text>
<line x1="40" y1="135" x2="1160" y2="135" stroke="#1f5fbf" stroke-width="4"/>

<rect x="35" y="160" width="1130" height="775" rx="20" class="paper"/>
<rect x="35" y="160" width="555" height="58" rx="18" class="navy"/>
<text x="60" y="199" fill="#fff" class="h2">1) 2-MINUTE REM EXAMPLE (4 EPOCHS)</text>
<rect x="910" y="168" width="240" height="44" rx="14" fill="#eef5ff" stroke="#1f5fbf" stroke-width="2"/>
<text x="1030" y="197" text-anchor="middle" class="label blue">STAGE: REM</text>

<text x="50" y="253" class="label muted">Clock time</text>
<text x="200" y="253" class="label navy">00:00</text><text x="430" y="253" class="label navy">00:30</text><text x="660" y="253" class="label navy">01:00</text><text x="890" y="253" class="label navy">01:30</text><text x="1115" y="253" text-anchor="end" class="label navy">02:00</text>
<text x="315" y="230" text-anchor="middle" class="small blue">EPOCH 1</text><text x="545" y="230" text-anchor="middle" class="small blue">EPOCH 2</text><text x="775" y="230" text-anchor="middle" class="small blue">EPOCH 3</text><text x="1005" y="230" text-anchor="middle" class="small blue">EPOCH 4</text>
<line x1="200" y1="265" x2="200" y2="895" class="grid"/><line x1="430" y1="265" x2="430" y2="895" class="epoch"/><line x1="660" y1="265" x2="660" y2="895" class="epoch"/><line x1="890" y1="265" x2="890" y2="895" class="epoch"/><line x1="1120" y1="265" x2="1120" y2="895" class="grid"/>

<g class="grid"><line x1="200" y1="315" x2="1120" y2="315"/><line x1="200" y1="385" x2="1120" y2="385"/><line x1="200" y1="455" x2="1120" y2="455"/><line x1="200" y1="525" x2="1120" y2="525"/><line x1="200" y1="600" x2="1120" y2="600"/><line x1="200" y1="675" x2="1120" y2="675"/><line x1="200" y1="750" x2="1120" y2="750"/><line x1="200" y1="825" x2="1120" y2="825"/><line x1="200" y1="895" x2="1120" y2="895"/></g>

<text x="55" y="302" class="label blue">EEG</text><text x="55" y="326" class="tiny muted">low-voltage mixed frequency</text>
<polyline class="traceB" points="200,306 220,297 240,310 260,300 280,313 300,295 320,307 340,301 360,312 380,296 400,308 420,303 440,314 460,296 480,308 500,300 520,314 540,299 560,310 580,298 600,311 620,301 640,309 660,297 680,312 700,299 720,309 740,296 760,311 780,300 800,314 820,298 840,309 860,300 880,312 900,297 920,310 940,299 960,313 980,296 1000,309 1020,301 1040,312 1060,298 1080,309 1100,301 1120,307"/>

