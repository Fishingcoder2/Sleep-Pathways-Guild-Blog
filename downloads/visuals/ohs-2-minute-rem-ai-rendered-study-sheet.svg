<polyline class="traceB" points="200,383 225,375 245,395 270,367 295,399 320,371 345,391 370,364 395,400 420,377 445,392 470,365 495,402 520,373 545,394 570,368 595,399 620,376 645,390 670,366 695,401 720,374 745,393 770,367 795,400 820,374 845,392 870,366 895,402 920,372 945,394 970,368 995,400 1020,374 1045,392 1070,365 1095,398 1120,381"/>

<text x="55" y="442" class="label blue">EOG 2</text><text x="55" y="466" class="tiny muted">right EOG</text>
<polyline class="traceB" points="200,453 225,462 245,442 270,470 295,438 320,466 345,446 370,473 395,437 420,460 445,445 470,472 495,435 520,464 545,443 570,469 595,438 620,461 645,447 670,471 695,436 720,463 745,444 770,470 795,437 820,463 845,445 870,471 895,435 920,465 945,443 970,469 995,437 1020,463 1045,445 1070,472 1095,439 1120,456"/>

<text x="55" y="512" class="label purple">Chin EMG</text><text x="55" y="536" class="tiny muted">low tone</text>
<polyline class="traceP" points="200,522 230,521 260,523 290,521 320,522 350,520 380,523 410,521 440,522 470,520 500,522 530,521 560,523 590,520 620,522 650,521 680,523 710,520 740,522 770,521 800,523 830,520 860,522 890,521 920,523 950,520 980,522 1010,521 1040,523 1070,520 1100,522 1120,521"/>

<text x="55" y="587" class="label navy">Airflow</text><text x="55" y="611" class="tiny muted">continued but shallow</text>
<path class="traceK" d="M200 600 C220 570 240 570 260 600 S300 630 320 600 S360 570 380 600 S420 630 440 600 S480 570 500 600 S540 630 560 600 S600 570 620 600 S660 630 680 600 S720 570 740 600 S780 630 800 600 S840 570 860 600 S900 630 920 600 S960 570 980 600 S1020 630 1040 600 S1080 570 1100 600 S1120 620 1120 600"/>

