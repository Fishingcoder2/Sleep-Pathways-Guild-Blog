name: Render OHS study sheet PNG

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Render PNG and update social metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          svg = Path('downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.svg')
          png = Path('downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.png')
          cairosvg.svg2png(bytestring=svg.read_bytes(), write_to=str(png), output_width=1200, output_height=1600)

          article = Path('2026/07/obesity-hypoventilation-polysomnography-rpsgt.html')
          text = article.read_text(encoding='utf-8')
          svg_abs = 'https://blog.sleeppathwaysguild.com/downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.svg'
          png_abs = 'https://blog.sleeppathwaysguild.com/downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.png'
          text = text.replace(f'<meta property="og:image" content="{svg_abs}">', f'<meta property="og:image" content="{png_abs}">')
          text = text.replace(f'<meta name="twitter:image" content="{svg_abs}">', f'<meta name="twitter:image" content="{png_abs}">')
          text = text.replace(f'"image":"{svg_abs}"', f'"image":"{png_abs}"')
          svg_button = '<a class="btn" href="/downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.svg" download>Download the OHS REM study sheet</a>'
          buttons = ('<a class="btn" href="/downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.png" download>Download PNG</a>'
                     '<a class="btn" href="/downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.svg" download>Download printable SVG</a>')
          text = text.replace(svg_button, buttons)
          article.write_text(text, encoding='utf-8')

          downloads = Path('downloads/index.html')
          text = downloads.read_text(encoding='utf-8')
          text = text.replace('href="/downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.svg" target="_blank" rel="noopener">Open or download resource</a>',
                              'href="/downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.png" target="_blank" rel="noopener">Open or download PNG</a>')
          downloads.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/render-ohs-png-main.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit PNG and metadata updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.png downloads/index.html 2026/07/obesity-hypoventilation-polysomnography-rpsgt.html .github/workflows/render-ohs-png-main.yml
          git commit -m "Add Facebook-friendly PNG for OHS lesson"
          git push
