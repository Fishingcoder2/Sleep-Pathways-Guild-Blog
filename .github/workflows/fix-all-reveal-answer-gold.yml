name: Fix all reveal answer buttons

on:
  push:
    paths:
      - .github/workflows/fix-all-reveal-answer-gold.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global gold reveal-answer styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/site-search.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(r"const ASSET_VERSION='[^']+';", "const ASSET_VERSION='20260724-revealgold2';", js, count=1)
          js = js.replace("'.spg-answer','details','.spg-checklist label'", "'.spg-answer','.spg-checklist label'")
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/site.css')
          css = css_path.read_text(encoding='utf-8')
          gold_css = r'''

/* Global accessible Reveal answer treatment — gold on navy */
.post-content details > summary,
.post-content details.spg-reveal > summary,
.post-content details[class*="reveal"] > summary,
.post-content details > summary:hover,
.post-content details > summary:focus,
.post-content details > summary:active,
.post-content details[open] > summary {
  display: block !important;
  background: #071a2e !important;
  color: #f6d365 !important;
  -webkit-text-fill-color: #f6d365 !important;
  border: 2px solid #d5a62e !important;
  border-radius: 12px !important;
  padding: 14px 18px !important;
  opacity: 1 !important;
  font-weight: 800 !important;
  line-height: 1.35 !important;
  text-shadow: none !important;
  cursor: pointer !important;
}
.post-content details > summary *,
.post-content details.spg-reveal > summary *,
.post-content details[class*="reveal"] > summary * {
  color: #f6d365 !important;
  -webkit-text-fill-color: #f6d365 !important;
  opacity: 1 !important;
  text-shadow: none !important;
}
.post-content details > summary::marker,
.post-content details > summary::-webkit-details-marker {
  color: #f6d365 !important;
}
.post-content details > summary:focus-visible {
  outline: 4px solid rgba(246, 211, 101, .45) !important;
  outline-offset: 3px !important;
}
'''
          if 'Global accessible Reveal answer treatment — gold on navy' not in css:
              css = css.rstrip() + gold_css + '\n'
          css_path.write_text(css, encoding='utf-8')

          script_re = re.compile(r'src="/assets/site-search\.js(?:\?v=[^"]+)?"')
          css_re = re.compile(r'href="/assets/site\.css(?:\?v=[^"]+)?"')
          changed = 0
          for page in Path('.').rglob('*.html'):
              if '.git' in page.parts:
                  continue
              html = page.read_text(encoding='utf-8')
              updated = script_re.sub('src="/assets/site-search.js?v=20260724-revealgold2"', html)
              updated = css_re.sub('href="/assets/site.css?v=20260724-revealgold2"', updated)
              if updated != html:
                  page.write_text(updated, encoding='utf-8')
                  changed += 1
          print(f'Cache-busted {changed} HTML pages.')
          PY

      - name: Commit repair and remove workflow
        run: |
          rm -f .github/workflows/fix-all-reveal-answer-gold.yml
          git config user.name "Sleep Pathways Guild Automation"
          git config user.email "admin@sleeppathsguild.com"
          git add -A
          git commit -m "Fix all Reveal answer buttons with accessible gold text"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Low-level ref update retrigger
