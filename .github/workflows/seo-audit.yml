name: SEO and link audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Normalize critical metadata
        run: python scripts/prepare_seo.py

      - name: Audit sitemap-listed SEO
        run: python scripts/seo_audit.py --site-url https://blog.sleeppathwaysguild.com

      - name: Audit internal and live links
        run: python scripts/link_audit.py --site-url https://blog.sleeppathwaysguild.com --live

      - name: Inventory downloads hub
        if: always()
        run: python scripts/download_link_inventory.py

      - name: Audit main-site and blog journey
        if: always()
        run: python scripts/cross_site_audit.py

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-audit-reports
          path: |
            seo-audit-report.txt
            link-audit-report.txt
            download-link-inventory.txt
            cross-site-audit-report.txt
