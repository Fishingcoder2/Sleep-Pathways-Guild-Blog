name: Apply article reference links

on:
  push:
    branches:
      - article-reference-links-2026-07-27
    paths:
      - tools/apply_article_reference_links.py
      - tools/relocate_reference_blocks.py
      - .github/workflows/apply-article-reference-links.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reference-link branch
        uses: actions/checkout@v4
        with:
          ref: article-reference-links-2026-07-27
          fetch-depth: 0

      - name: Add body-supported links
        run: |
          python3 tools/apply_article_reference_links.py
          python3 tools/relocate_reference_blocks.py

      - name: Validate disclosures and links
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_article_reference_links.py tools/relocate_reference_blocks.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = list(Path('.').glob('20[0-9][0-9]/*/*.html'))
          linked = 0
          affiliate = 0
          for path in pages:
              text = path.read_text(encoding='utf-8', errors='replace')
              starts = text.count('<!-- SPG LINKED REFERENCES START -->')
              ends = text.count('<!-- SPG LINKED REFERENCES END -->')
              if starts != ends or starts > 1:
                  raise SystemExit(f'Invalid reference markers: {path}')
              if starts == 1:
                  linked += 1
                  first_body_close = text.lower().find('</body>')
                  marker = text.find('<!-- SPG LINKED REFERENCES START -->')
                  if first_body_close >= 0 and marker > first_body_close:
                      raise SystemExit(f'Reference panel is outside the first body: {path}')
              amazon = re.findall(r'<a\b[^>]*href=["\'](https://www\.amazon\.com/[^"\']+)["\'][^>]*>', text, re.I)
              if amazon:
                  affiliate += 1
                  if 'As an Amazon Associate I earn from qualifying purchases.' not in text:
                      raise SystemExit(f'Missing Amazon disclosure: {path}')
                  for match in re.finditer(r'<a\b[^>]*href=["\']https://www\.amazon\.com/[^"\']+["\'][^>]*>', text, re.I):
                      tag = match.group(0).lower()
                      if 'tag=spg_rpsgt-20' not in tag:
                          raise SystemExit(f'Missing affiliate tag: {path}')
                      if 'sponsored' not in tag or 'nofollow' not in tag:
                          raise SystemExit(f'Missing sponsored/nofollow: {path}')
          store = Path('p/rpsgt-exam-prep-book-store.html').read_text(encoding='utf-8', errors='replace')
          if 'As an Amazon Associate I earn from qualifying purchases.' not in store:
              raise SystemExit('Bookstore disclosure missing')
          print(f'Validated {linked} linked articles; {affiliate} include affiliate book links.')
          PY

      - name: Commit linked articles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sleep Pathways Guild Automation'
          git config user.email 'admin@sleeppathsguild.com'
          git add 2026 p/rpsgt-exam-prep-book-store.html
          if git diff --cached --quiet; then
            echo 'Reference links are current.'
          else
            git commit -m 'Place verified reference panels inside article bodies'
            git pull --rebase origin article-reference-links-2026-07-27
            git push origin HEAD:article-reference-links-2026-07-27
          fi
