name: Migrate public study downloads

on:
  push:
    paths:
      - .github/workflows/migrate-public-downloads.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick poppler-utils file

      - name: Download and normalize public resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/visuals downloads/pdfs /tmp/spg-downloads

          fetch_raw() {
            local id="$1"
            local out="$2"
            curl --fail --location --retry 4 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              --output "$out"
            test -s "$out"
          }

          fetch_image() {
            local id="$1"
            local out="$2"
            local tmp="/tmp/spg-downloads/$(basename "$out").source"
            fetch_raw "$id" "$tmp"
            local mime
            mime="$(file --brief --mime-type "$tmp")"
            case "$mime" in
              image/*)
                convert "$tmp" -auto-orient -strip -quality 92 "$out"
                ;;
              *)
                echo "Expected an image for $out but received $mime"
                head -c 240 "$tmp" || true
                exit 1
                ;;
            esac
          }

          fetch_pdf() {
            local id="$1"
            local out="$2"
            local tmp="/tmp/spg-downloads/$(basename "$out").source"
            fetch_raw "$id" "$tmp"
            local mime
            mime="$(file --brief --mime-type "$tmp")"
            if [[ "$mime" != "application/pdf" ]]; then
              echo "Expected a PDF for $out but received $mime"
              head -c 240 "$tmp" || true
              exit 1
            fi
            cp "$tmp" "$out"
          }

          # Finished Sleep Pathways Guild study visuals already referenced by blog posts.
          fetch_image "1rx9KGTGvdT6vSff0qcjE2w4B_mF-EV3s" "downloads/visuals/coach-bob-brain-waves-and-sleep-staging.jpg"
          fetch_image "1MD2jJEdFXGpvjxBr6frtArPbCvXtcdvg" "downloads/visuals/coach-bob-stage-n2-sleep.jpg"
          fetch_image "1pnmxqp7HZTueqvDcP1sCaUU5fUPtDqi4" "downloads/visuals/snore-artifact-rpsgt-practice.jpg"
          fetch_image "11zOqnD-zk4eDhYKoaZVxGZlAep1xTttk" "downloads/visuals/pap-leak-artifact-recognition.jpg"
          fetch_image "1Od6gbtGcOsSw4XuG6sos54UGXvS1o4KO" "downloads/visuals/uppp-mallampati-airway-treatment-guide.jpg"

          # Other public visuals currently linked through Google Drive.
          fetch_image "1AcPpBB4QJnc3RJ9D5QyJqHtow_s51sW4" "downloads/visuals/cpap-titration-decision-tree.jpg"
          fetch_image "1EOSneLsj0SNHp05g8fK5PxC6dEjO4NLR" "downloads/visuals/respiratory-events-rera-uars-pediatric-apnea.jpg"

          # Printable PDF resources.
          fetch_pdf "1tO-EY5P3Uz-kDTc-F9IKBiUfG-V5fU4v" "downloads/pdfs/ekg-artifact-recognition-lab.pdf"
          fetch_pdf "1KA58F-_GsDP1ORmCOOLzJY9YxFPVNDKX" "downloads/pdfs/rpsgt-one-hour-a-day-readiness-tracker.pdf"

          # Create same-domain preview images for PDF resources.
          pdftoppm -jpeg -f 1 -singlefile -r 150 \
            "downloads/pdfs/ekg-artifact-recognition-lab.pdf" \
            "downloads/visuals/ekg-artifact-recognition-lab"
          pdftoppm -jpeg -f 1 -singlefile -r 120 \
            "downloads/pdfs/rpsgt-one-hour-a-day-readiness-tracker.pdf" \
            "downloads/visuals/rpsgt-readiness-tracker-cover"

          find downloads -type f -maxdepth 3 -print -exec file {} \;

      - name: Commit hosted downloads and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-public-downloads.yml
          git config user.name "Sleep Pathways Guild Automation"
          git config user.email "admin@sleeppathsguild.com"
          git add downloads .github/workflows/migrate-public-downloads.yml
          git commit -m "Host public study visuals and PDFs on blog domain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
