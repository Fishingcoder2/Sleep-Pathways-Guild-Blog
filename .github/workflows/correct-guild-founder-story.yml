name: Correct Guild founder story on blog

on:
  push:
    paths:
      - '.github/workflows/correct-guild-founder-story.yml'

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct founder, mentor, and memorial history
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/site-search.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("const ASSET_VERSION='20260724-mission1';", "const ASSET_VERSION='20260724-founder2';", 1)

          old = '''    section.innerHTML=`<span class="spg-home-kicker">Free public learning • Education first</span><h2 id="spg-home-mission-title">A guild for the craft of sleep technology.</h2><p>Sleep Pathways Guild is an independent, peer-led educational project built to keep practical sleep-technology learning within reach. The blog is one part of a wider collection of free public webapps, labs, articles, downloads, and professional support for RPSGT learners, CPSGT learners, students, and working technologists.</p><div class="spg-home-mission-grid"><article class="spg-home-mission-card"><h3>Robert Dopson, RPSGT</h3><p>The Guild was built from the perspective of a sleep technologist who believes serious learners deserve practical explanations, useful tools, encouragement, and a place to begin without cost being the first obstacle.</p></article><article class="spg-home-mission-card"><h3>Inspired by Dr. William C. Dement</h3><p>The Guild honors Dr. Dement’s example as a sleep-medicine pioneer, teacher, and public advocate who worked to help people understand that sleep matters. <a href="https://med.stanford.edu/news/all-news/2020/06/william-dement-giant-in-field-of-sleep-medicine-dies-at-91.html" target="_blank" rel="noopener">Read Stanford Medicine’s remembrance.</a></p></article><article class="spg-home-mission-card"><h3>Free public offerings</h3><p>Open the RPSGT study webapp, EKG Skills Lab, free study downloads, and blog lessons. A separate CPSGT webapp is nearing release. Buying a book is never required to begin learning.</p></article></div><div class="spg-home-mission-actions"><a class="primary" href="https://sleeppathwaysguild.com/#free-resources">Explore Free Guild Resources</a><a class="secondary" href="https://sleeppathwaysguild.com/RPSGTv2.2026.html">Launch the RPSGT Webapp</a><a class="secondary" href="/downloads/">Open Free Downloads</a></div>`;'''

          new = '''    section.innerHTML=`<span class="spg-home-kicker">Free public learning • Education first</span><h2 id="spg-home-mission-title">A guild for the craft of sleep technology.</h2><p>Sleep Pathways Guild is an independent, peer-led educational project founded by <strong>Tracy Frazier, RHIT, RPSGT, CCS-P</strong>. The blog is one part of a wider collection of free public webapps, labs, articles, downloads, and professional support for RPSGT learners, CPSGT learners, students, and working technologists.</p><div class="spg-home-mission-grid"><article class="spg-home-mission-card"><h3>Founded by Tracy Frazier, RHIT, RPSGT, CCS-P</h3><p>Tracy created the Guild from her experience as a sleep technologist, health information professional, credentialed coding specialist, learner, and educator. She believes serious learners deserve practical explanations, free public tools, encouragement, and a place to begin without cost being the first obstacle.</p></article><article class="spg-home-mission-card"><h3>Inspired by mentor Robert Dopson, RPSGT</h3><p>Robert never turned away an intern or serious learner. He taught in a Socratic way, asking <strong>who, what, when, where, why, and to what extent</strong> before answering the question. That habit of careful inquiry remains part of the Guild’s educational foundation.</p></article><article class="spg-home-mission-card"><h3>Honoring William C. Dement, MD, PhD</h3><p>The Guild honors the memory of Dr. Dement, a founder of sleep medicine, legendary teacher, and public advocate. His verified motto was: <strong>“Drowsiness is red alert.”</strong> <a href="https://med.stanford.edu/news/all-news/2020/06/william-dement-giant-in-field-of-sleep-medicine-dies-at-91.html" target="_blank" rel="noopener">Read Stanford Medicine’s remembrance.</a></p></article><article class="spg-home-mission-card"><h3>Free public offerings</h3><p>Open the RPSGT study webapp, EKG Skills Lab, free study downloads, and blog lessons. A separate CPSGT webapp is nearing release. Buying a book is never required to begin learning.</p></article></div><div class="spg-home-mission-actions"><a class="primary" href="https://sleeppathwaysguild.com/#free-resources">Explore Free Guild Resources</a><a class="secondary" href="https://sleeppathwaysguild.com/RPSGTv2.2026.html">Launch the RPSGT Webapp</a><a class="secondary" href="/downloads/">Open Free Downloads</a></div>`;'''

          if old not in text:
              raise SystemExit('Existing blog mission block was not found.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-search.js
          git commit -m "Correct Guild founder mentor and memorial story"
          git push
