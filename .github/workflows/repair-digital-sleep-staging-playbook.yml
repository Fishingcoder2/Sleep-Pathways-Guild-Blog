name: Repair broken study downloads

on:
  push:
    paths:
      - '.github/workflows/repair-digital-sleep-staging-playbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate intact originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/visuals downloads/pdfs /tmp/spg-repair

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=14FNPSqYw7MHqlFMt5IUlvuUukaak0GL0&export=download&confirm=t' \
            --output /tmp/spg-repair/digital-sleep-staging-playbook.jpg

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1kNOMP3pCq7u3la0uZPSuhqxbiSfjEURi&export=download&confirm=t' \
            --output /tmp/spg-repair/rpsgt-one-hour-a-day-readiness-tracker-print.pdf

          test "$(file --brief --mime-type /tmp/spg-repair/digital-sleep-staging-playbook.jpg)" = 'image/jpeg'
          test "$(file --brief --mime-type /tmp/spg-repair/rpsgt-one-hour-a-day-readiness-tracker-print.pdf)" = 'application/pdf'

          python3 - <<'PY'
          from pathlib import Path
          image = Path('/tmp/spg-repair/digital-sleep-staging-playbook.jpg').read_bytes()
          pdf = Path('/tmp/spg-repair/rpsgt-one-hour-a-day-readiness-tracker-print.pdf').read_bytes()
          if not image.startswith(b'\xff\xd8\xff') or not image.rstrip().endswith(b'\xff\xd9'):
              raise SystemExit('Playbook is not a complete JPEG.')
          if not pdf.startswith(b'%PDF-') or b'%%EOF' not in pdf[-2048:]:
              raise SystemExit('Print tracker is not a complete PDF.')
          if len(image) < 10000 or len(pdf) < 10000:
              raise SystemExit('Downloaded resource is unexpectedly small.')
          PY

          cp /tmp/spg-repair/digital-sleep-staging-playbook.jpg \
            downloads/visuals/digital-sleep-staging-playbook.jpg
          cp /tmp/spg-repair/rpsgt-one-hour-a-day-readiness-tracker-print.pdf \
            downloads/pdfs/rpsgt-one-hour-a-day-readiness-tracker-print.pdf

      - name: Commit repaired files and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-digital-sleep-staging-playbook.yml
          git config user.name 'Sleep Pathways Guild Automation'
          git config user.email 'admin@sleeppathsguild.com'
          git add -A
          git commit -m 'Repair playbook and print tracker downloads'
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Retrigger without actor restriction.
