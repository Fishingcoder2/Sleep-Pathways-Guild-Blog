name: Add Shift Report August Update to Blog Listings

on:
  push:
    branches:
      - main
    paths:
      - .github/blog-release-2026-08-11.txt

permissions:
  contents: write

jobs:
  update-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update homepage archive RSS and sitemap
        run: python scripts/inject-latest-post.py

      - name: Commit generated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/index.html feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "Listings already current."
          else
            git commit -m "Add August 11 Shift Report update to blog listings"
            git push
          fi
