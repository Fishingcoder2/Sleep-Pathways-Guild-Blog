name: Apply SEO phase 4 skill hub links

on:
  push:
    branches:
      - seo-phase-4-skill-hubs-2026-07-29

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-phase-4-skill-hubs-2026-07-29
          fetch-depth: 0
      - name: Link permanent skill hubs from homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          text = page.read_text(encoding='utf-8')
          old = '<a href="/?topic=scoring">Scoring & PSG</a><a href="/?topic=respiratory">Respiratory</a>'
          new = '<a href="/topics/sleep-scoring-practice/">Scoring & PSG</a><a href="/topics/psg-artifact-recognition/">PSG Artifacts</a><a href="/topics/pap-titration-troubleshooting/">PAP & Respiratory</a>'
          if old not in text:
              raise SystemExit('Expected homepage topic links not found')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit homepage skill hub links
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link scoring, PAP, and artifact hubs from homepage"
          git push origin HEAD:seo-phase-4-skill-hubs-2026-07-29