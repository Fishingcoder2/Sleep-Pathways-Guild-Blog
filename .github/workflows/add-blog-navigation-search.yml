name: Add blog navigation and search
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-blog-navigation-search.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build navigation and search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, html

          root = Path('.')
          html_files = [p for p in root.rglob('*.html') if '.git' not in p.parts]
          entries=[]
          for p in html_files:
              if p.name=='404.html':
                  continue
              text=p.read_text(encoding='utf-8', errors='ignore')
              title_m=re.search(r'<title>(.*?)</title>', text, re.I|re.S)
              desc_m=re.search(r'<meta name="description" content="(.*?)"', text, re.I|re.S)
              h1_m=re.search(r'<h1[^>]*>(.*?)</h1>', text, re.I|re.S)
              title=re.sub('<[^>]+>','', h1_m.group(1) if h1_m else (title_m.group(1) if title_m else p.stem))
              title=html.unescape(title).strip()
              desc=html.unescape(desc_m.group(1)).strip() if desc_m else ''
              url='/' if p.name=='index.html' and p.parent==root else '/' + str(p).replace('index.html','').replace('\\','/')
              if url!='/' and not url.endswith('/') and p.name=='index.html': url+='/'
              if '/p/' in url: category='Resources'
              elif 'pediatric' in (title+' '+desc).lower(): category='Pediatric Sleep'
              elif any(k in (title+' '+desc).lower() for k in ['ekg','ecg','cardiac','arrhythm']): category='EKG & Cardiac'
              elif any(k in (title+' '+desc).lower() for k in ['scoring','stage n','sleep staging','respiratory event','rera','apnea']): category='Scoring & PSG'
              elif any(k in (title+' '+desc).lower() for k in ['rpsgt','exam prep','study']): category='RPSGT Exam Prep'
              else: category='Sleep Technology'
              if url not in ['/archive/']:
                  entries.append({'title':title,'description':desc,'url':url,'category':category})

          Path('assets').mkdir(exist_ok=True)
          Path('assets/search-index.json').write_text(json.dumps(entries, ensure_ascii=False, indent=2), encoding='utf-8')

          js=r'''(() => {
            const $=(s,c=document)=>c.querySelector(s);
            const $$=(s,c=document)=>[...c.querySelectorAll(s)];
            const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            const overlay=document.createElement('div');
            overlay.className='search-overlay';
            overlay.innerHTML=`<div class="search-panel" role="dialog" aria-modal="true" aria-label="Search Sleep Pathways Guild Blog"><div class="search-head"><div><strong>Search the blog</strong><span>Find articles, lessons, scoring topics, and study resources</span></div><button class="search-close" aria-label="Close search">×</button></div><input class="search-input" type="search" placeholder="Try: respiratory events, EKG, pediatric, RPSGT…" autocomplete="off"><div class="search-chips"><button data-q="RPSGT">RPSGT Exam Prep</button><button data-q="scoring">Scoring</button><button data-q="pediatric">Pediatric</button><button data-q="EKG">EKG</button><button data-q="respiratory">Respiratory</button></div><div class="search-status">Start typing to search all articles.</div><div class="search-results"></div></div>`;
            document.body.appendChild(overlay);
            let index=[];
            fetch('/assets/search-index.json').then(r=>r.json()).then(d=>index=d).catch(()=>{});
            const input=$('.search-input',overlay), results=$('.search-results',overlay), status=$('.search-status',overlay);
            function openSearch(q=''){overlay.classList.add('open');document.body.classList.add('search-open');setTimeout(()=>input.focus(),40);if(q){input.value=q;run(q)}}
            function closeSearch(){overlay.classList.remove('open');document.body.classList.remove('search-open')}
            function run(q){q=q.trim().toLowerCase();results.innerHTML='';if(!q){status.textContent='Start typing to search all articles.';return}const terms=q.split(/\s+/);const found=index.map(x=>{const hay=(x.title+' '+x.description+' '+x.category).toLowerCase();let score=0;terms.forEach(t=>{if(x.title.toLowerCase().includes(t))score+=5;if(x.category.toLowerCase().includes(t))score+=3;if(hay.includes(t))score+=1});return {...x,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,20);status.textContent=found.length?`${found.length} result${found.length===1?'':'s'} found`:'No results found. Try a broader term.';results.innerHTML=found.map(x=>`<a class="search-result" href="${esc(x.url)}"><span class="search-category">${esc(x.category)}</span><strong>${esc(x.title)}</strong><p>${esc(x.description||'Open this article')}</p></a>`).join('')}
            input.addEventListener('input',e=>run(e.target.value));
            $$('.search-chips button',overlay).forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.q;run(b.dataset.q);input.focus()}));
            $('.search-close',overlay).addEventListener('click',closeSearch);overlay.addEventListener('click',e=>{if(e.target===overlay)closeSearch()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
            $$('.js-search').forEach(b=>b.addEventListener('click',()=>openSearch()));
            const menuBtn=$('.menu-toggle'), nav=$('.site-nav'); if(menuBtn&&nav)menuBtn.addEventListener('click',()=>{const on=nav.classList.toggle('open');menuBtn.setAttribute('aria-expanded',String(on))});
            const path=location.pathname; $$('.site-nav a').forEach(a=>{const href=a.getAttribute('href'); if(href==='/'?path==='/':href&&path.startsWith(href))a.classList.add('active')});
          })();'''
          Path('assets/site-search.js').write_text(js,encoding='utf-8')

          css=Path('assets/site.css').read_text(encoding='utf-8') if Path('assets/site.css').exists() else ''
          css += r'''
          .topin{position:relative}.site-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.site-nav a,.nav-action{border:0;background:transparent;font:inherit;text-decoration:none;color:var(--muted);padding:9px 12px;border-radius:999px;cursor:pointer}.site-nav a:hover,.site-nav a.active,.nav-action:hover{background:rgba(255,255,255,.1);color:#fff}.nav-action{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.14)}.menu-toggle{display:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:10px 12px;font-size:1.1rem}.topic-nav{border-bottom:1px solid var(--line);background:rgba(9,23,39,.82)}.topic-nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.topic-nav .wrap::-webkit-scrollbar{display:none}.topic-nav a{white-space:nowrap;text-decoration:none;color:#d8e7f8;border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:8px 12px;font-size:.9rem}.topic-nav a:hover{background:rgba(47,183,176,.16);border-color:rgba(47,183,176,.4)}.search-overlay{position:fixed;inset:0;background:rgba(2,8,15,.78);backdrop-filter:blur(8px);z-index:1000;display:none;padding:5vh 16px}.search-overlay.open{display:block}.search-open{overflow:hidden}.search-panel{width:min(760px,100%);max-height:90vh;overflow:auto;margin:auto;background:#f8fbff;color:#102033;border-radius:24px;box-shadow:0 30px 100px rgba(0,0,0,.5);padding:22px}.search-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.search-head strong{font:700 clamp(1.5rem,4vw,2.2rem) Georgia,serif;display:block}.search-head span{display:block;color:#5a6d82;margin-top:5px}.search-close{border:0;background:#e8eef6;color:#17324c;width:42px;height:42px;border-radius:50%;font-size:1.8rem;cursor:pointer}.search-input{width:100%;margin:20px 0 12px;padding:15px 17px;border-radius:14px;border:2px solid #ccd9e7;font-size:1rem;outline:none}.search-input:focus{border-color:#1f6fbf;box-shadow:0 0 0 4px rgba(31,111,191,.12)}.search-chips{display:flex;gap:8px;flex-wrap:wrap}.search-chips button{border:1px solid #cddbe8;background:white;color:#22415f;border-radius:999px;padding:8px 11px;cursor:pointer}.search-status{color:#64778b;font-size:.92rem;margin:16px 0 8px}.search-results{display:grid;gap:10px}.search-result{display:block;text-decoration:none;color:#17324c;background:white;border:1px solid #dce6f0;border-radius:16px;padding:15px;transition:.15s}.search-result:hover{transform:translateY(-1px);border-color:#66b9b4;box-shadow:0 10px 22px rgba(16,52,58,.08)}.search-result strong{display:block;font-size:1.05rem;margin:4px 0}.search-result p{margin:0;color:#607386;line-height:1.45}.search-category{display:inline-block;color:#0f766e;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.search-launch{display:flex;justify-content:center;margin:8px 0 28px}.search-launch button{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.search-launch button:hover{background:rgba(47,183,176,.18)}
          @media(max-width:900px){.menu-toggle{display:block}.site-nav{display:none;position:absolute;left:0;right:0;top:calc(100% + 10px);background:#0b1a2c;border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}.site-nav.open{display:grid}.site-nav a,.nav-action{text-align:left;width:100%;border-radius:10px}.topin{flex-direction:row;align-items:center}.brand span{display:none}}
          @media(max-width:560px){.search-panel{padding:17px;border-radius:18px}.search-overlay{padding:12px}.topic-nav .wrap{width:calc(100% - 20px)}}
          '''
          Path('assets/site.css').write_text(css,encoding='utf-8')

          old_nav_re=re.compile(r'<nav class="nav" aria-label="Primary">.*?</nav>',re.I|re.S)
          new_nav='''<button class="menu-toggle" aria-expanded="false" aria-label="Open menu">☰</button><nav class="site-nav" aria-label="Primary"><a href="/">Latest</a><a href="/archive/">Archive</a><a href="/p/rpsgt-exam-prep-book-store.html">Book Store</a><a href="https://sleeppathwaysguild.com/RPSGTv2.2026.html">RPSGT Webapp</a><a href="https://sleeppathwaysguild.com/">Main Site</a><button class="nav-action js-search" type="button">⌕ Search</button></nav>'''
          topics='''<div class="topic-nav" aria-label="Topic shortcuts"><div class="wrap"><a href="/?topic=rpsgt">RPSGT Exam Prep</a><a href="/?topic=scoring">Scoring & PSG</a><a href="/?topic=respiratory">Respiratory</a><a href="/?topic=pediatric">Pediatric Sleep</a><a href="/?topic=ekg">EKG & Cardiac</a><a href="/p/rpsgt-exam-prep-book-store.html">Study Resources</a></div></div>'''
          for p in html_files:
              text=p.read_text(encoding='utf-8',errors='ignore')
              text=old_nav_re.sub(new_nav,text)
              if 'class="topic-nav"' not in text:
                  text=text.replace('</header>','</header>'+topics,1)
              if '/assets/site-search.js' not in text:
                  text=text.replace('</body>','<script src="/assets/site-search.js" defer></script></body>')
              if p.name=='index.html' and p.parent==root and 'search-launch' not in text:
                  text=text.replace('</section><section class="wrap grid">','</section><div class="wrap search-launch"><button class="js-search" type="button">⌕ Search all blog articles</button></div><section class="wrap grid">',1)
              p.write_text(text,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add site-wide navigation and blog search" || exit 0
          git push
