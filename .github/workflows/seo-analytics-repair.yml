name: Validate blog analytics and SEO

on:
  push:
    branches:
      - seo-analytics-repair-2026-07-27
    paths:
      - tools/seo_repair.py
      - tools/normalize_head_order.py
      - .github/workflows/seo-analytics-repair.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: seo-analytics-repair-2026-07-27
          fetch-depth: 0

      - name: Apply analytics and technical SEO repair
        run: |
          python3 tools/seo_repair.py
          python3 tools/normalize_head_order.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s robots.txt
          test -s sitemap.xml
          test -s feed.xml
          test -s 404.html
          grep -R --include='*.html' -L 'G-MZTRYT67VG' . | grep -v '^./.git/' && exit 1 || true
          grep -q '<urlset' sitemap.xml
          grep -q '<rss' feed.xml
          python3 -m py_compile tools/seo_repair.py tools/normalize_head_order.py
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              charset = text.lower().find('<meta charset')
              marker = text.find('<!-- SPG SEO START -->')
              if charset < 0 or marker < 0 or charset > marker:
                  raise SystemExit(f'Head order validation failed: {path}')
          PY

      - name: Confirm generated SEO files are committed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git diff --stat
            echo '::error::The SEO generator changed tracked files. Commit those generated changes before merging.'
            exit 1
          fi
          echo 'Blog SEO and analytics files are current.'
