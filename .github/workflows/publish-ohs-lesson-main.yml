name: Publish OHS lesson to blog indexes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add OHS lesson to blog, downloads, feed, sitemap, and topic hubs
        run: |
          python - <<'PY'
          from pathlib import Path

          article_url = '/2026/07/obesity-hypoventilation-polysomnography-rpsgt.html'
          absolute_url = 'https://blog.sleeppathwaysguild.com' + article_url
          title = 'Obesity Hypoventilation on Polysomnography: Practical RPSGT Board-Prep Notes'
          summary = ('Interactive lesson for the polysomnographic technician and sleep technician on recognizing obesity-related '
                     'hypoventilation during REM, applying CO2 scoring anchors, interpreting chart clues, and reviewing PAP, oxygen, medication, and surgical treatment options.')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # Homepage card
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if article_url not in text:
              card = (f'<article class="card"><div class="meta">July 30, 2026</div><h2>{title}</h2>'
                      f'<p class="summary">{summary}</p><a class="read" href="{article_url}">Read article</a></article>')
              marker = '<section class="wrap grid">'
              if marker not in text:
                  raise SystemExit('Homepage grid marker not found')
              text = text.replace(marker, marker + card, 1)
              write(path, text)

          # Archive card
          path = Path('archive/index.html')
          text = path.read_text(encoding='utf-8')
          if article_url not in text:
              card = (f'<article class="card"><div class="meta">July 30, 2026</div><h2><a href="{article_url}">{title}</a></h2></article>')
              marker = '<section class="wrap grid">'
              if marker not in text:
                  raise SystemExit('Archive grid marker not found')
              text = text.replace(marker, marker + card, 1)
              write(path, text)

          # Free downloads card
          path = Path('downloads/index.html')
          text = path.read_text(encoding='utf-8')
          download_url = '/downloads/visuals/ohs-2-minute-rem-ai-rendered-study-sheet.svg'
          if download_url not in text:
              card = ('<article class="resource"><span>AI-rendered study visual</span>'
                      '<h2>Obesity Hypoventilation: Two-Minute REM PSG Study Sheet</h2>'
                      '<p>Four 30-second REM epochs with two EOG channels, shallow airflow, reduced effort, falling SpO₂, rising tcCO₂, and fictional chart clues.</p>'
                      f'<a href="{download_url}" target="_blank" rel="noopener">Open or download resource</a></article>')
              marker = '<section class="grid">'
              if marker not in text:
                  raise SystemExit('Downloads grid marker not found')
              text = text.replace(marker, marker + card, 1)
              write(path, text)

          # RSS feed
          path = Path('feed.xml')
          text = path.read_text(encoding='utf-8')
          if absolute_url not in text:
              text = text.replace('<lastBuildDate>2026-07-28T16:00:00Z</lastBuildDate>', '<lastBuildDate>2026-07-30T14:41:00Z</lastBuildDate>', 1)
              item = f'''\n  <item>\n    <title>{title} | Sleep Pathways Guild</title>\n    <link>{absolute_url}</link>\n    <guid isPermaLink="true">{absolute_url}</guid>\n    <pubDate>2026-07-30T14:41:00Z</pubDate>\n    <description>{summary}</description>\n  </item>'''
              marker = '<lastBuildDate>2026-07-30T14:41:00Z</lastBuildDate>'
              if marker not in text:
                  raise SystemExit('Feed build-date marker not found')
              text = text.replace(marker, marker + item, 1)
              write(path, text)

          # Sitemap
          path = Path('sitemap.xml')
          text = path.read_text(encoding='utf-8')
          if absolute_url not in text:
              text = text.replace('<url><loc>https://blog.sleeppathwaysguild.com/</loc><lastmod>2026-07-29</lastmod></url>', '<url><loc>https://blog.sleeppathwaysguild.com/</loc><lastmod>2026-07-30</lastmod></url>', 1)
              entry = f'  <url><loc>{absolute_url}</loc><lastmod>2026-07-30</lastmod></url>\n'
              text = text.replace('</urlset>', entry + '</urlset>', 1)
              write(path, text)

          # RPSGT hub
          path = Path('topics/rpsgt-exam-prep/index.html')
          text = path.read_text(encoding='utf-8')
          if article_url not in text:
              item = (f'<a href="{article_url}"><strong>Obesity hypoventilation on polysomnography</strong><br>'
                      'Recognize REM hypoventilation patterns, review CO₂ scoring anchors, chart clues, PAP, oxygen, medication, and surgical treatment.</a>')
              marker = '<div class="resource-list">'
              if marker not in text:
                  raise SystemExit('RPSGT hub resource marker not found')
              text = text.replace(marker, marker + item, 1)
              write(path, text)

          # Sleep-scoring hub
          path = Path('topics/sleep-scoring-practice/index.html')
          text = path.read_text(encoding='utf-8')
          if article_url not in text:
              item = (f'<a href="{article_url}"><strong>Obesity hypoventilation PSG and hypnogram practice</strong><br>'
                      'Follow airflow, effort, SpO₂, and CO₂ across a two-minute REM simulation and whole-night trend.</a>')
              marker = '<div class="resource-list">'
              if marker not in text:
                  raise SystemExit('Scoring hub resource marker not found')
              text = text.replace(marker, marker + item, 1)
              write(path, text)

          # PAP hub
          path = Path('topics/pap-titration-troubleshooting/index.html')
          text = path.read_text(encoding='utf-8')
          if article_url not in text:
              item = (f'<a href="{article_url}"><strong>OHS treatment: CPAP, bilevel/NIV, oxygen, medication, and surgery</strong><br>'
                      'Review why controlling the AHI may not correct ventilation and how persistent hypoxemia is approached under protocol.</a>')
              marker = '<div class="resource-list">'
              if marker not in text:
                  raise SystemExit('PAP hub resource marker not found')
              text = text.replace(marker, marker + item, 1)
              write(path, text)

          # Remove this one-time workflow from the commit it creates.
          workflow = Path('.github/workflows/publish-ohs-lesson-main.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit published indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/index.html downloads/index.html feed.xml sitemap.xml topics/rpsgt-exam-prep/index.html topics/sleep-scoring-practice/index.html topics/pap-titration-troubleshooting/index.html .github/workflows/publish-ohs-lesson-main.yml
          if git diff --cached --quiet; then
            echo "No publication changes needed."
            exit 0
          fi
          git commit -m "Publish OHS lesson across blog and downloads"
          git push
